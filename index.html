<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Súmula - Pelada do Amor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        
        /* BUG VISUAL INTENCIONAL: O botão tem a mesma cor do fundo, ferindo a usabilidade */
        .btn-salvar { background-color: #f0f0f0; color: #f0f0f0; border: none; padding: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Súmula Oficial - Pelada do Amor</h2>
        <p><strong>Data do Marco Histórico:</strong> 19/03/2025</p>
        
        <form>
            <div class="input-group">
                <label>Craque da Partida:</label>
                <input type="text" value="Bobby Charlton" readonly>
            </div>
            
            <div class="input-group">
                <label>Gols Marcados:</label>
                <!-- BUG LÓGICO INTENCIONAL: Aceita números negativos -->
                <input type="number" id="gols" name="gols" min="-10">
            </div>
            
            <button type="button" class="btn-salvar">Salvar Estatísticas</button>
        </form>
    </div>
</body>
</html>
